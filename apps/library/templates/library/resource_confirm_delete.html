{% extends "library/base.html" %}

{% block content %}
<h1>Delete resource</h1>

<p>Are you sure you want to delete "{{ resource.title }}"?</p>

<form method="post">
  {% csrf_token %}
  <button type="submit">Yes, delete</button>
  <a href="{% url 'library:resource_detail' resource.pk %}">Cancel</a>
</form>
{% endblock %}
