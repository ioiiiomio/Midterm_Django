<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KBTU CampusHub - Library</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 15px; }
    nav a { margin-right: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    .message { background: #e7f6e7; padding: 8px; margin: 10px 0; }
    .errorlist { color: red; }
  </style>
</head>
<body>
    <nav>
    <a href="{% url 'library:list' %}">Library</a>
    {% if user.role == "tutor" or user.role == "admin" %}
      <a href="{% url 'library:create' %}">Add resource</a>
    {% endif %}
    {% if not user.is_authenticated %}
      <a href="{% url 'admin:login' %}?next={{ request.path }}">Log in</a>
    {% endif %}
  </nav>
  <hr>

  {% for message in messages %}
    <div class="message">{{ message }}</div>
  {% endfor %}

  {% block content %}{% endblock %}
</body>
</html>
