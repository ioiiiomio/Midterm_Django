{% extends "base.html" %}

{% block title %}Edit profile{% endblock %}

{% block content %}
    <h2>Edit profile</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
    <a href="{% url 'users:profile' %}">Cancel</a>
{% endblock %}
