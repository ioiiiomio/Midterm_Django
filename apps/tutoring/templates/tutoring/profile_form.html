{% extends "base.html" %}

{% block title %}My tutor profile{% endblock %}

{% block content %}
    <h2>My tutor profile</h2>
    <p><small>Students see this on the tutors page. Turn on "Is available" to appear in the list.</small></p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>

    <p>
        <a href="{% url 'tutoring:my_schedule' %}">My schedule</a> ·
        <a href="{% url 'tutoring:tutor_detail' object.pk %}">View my public page</a>
    </p>
{% endblock %}
