{% extends "base.html" %}

{% block title %}Review tutoring session | CampusHub{% endblock %}

{% block content %}
    <h1>Review {{ booking.session.title }}</h1>
    <p>{{ booking.session.tutor.user.full_name }} · {{ booking.session.ends_at }}</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit review</button>
    </form>
{% endblock %}
